<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>页面加载中...</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #f5f5f5;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
        }

        #loading {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: #ffffff;
            z-index: 9999;
            transition: opacity 0.3s ease;
            padding: 20px;
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid #f3f3f3;
            border-top: 3px solid #07c160;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            display: none;
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }

        #loading p {
            margin-top: 15px;
            color: #999;
            font-size: 14px;
        }

        .url-box {
            margin-top: 20px;
            max-width: 90%;
            word-break: break-all;
            background: #f8f8f8;
            padding: 10px;
            border-radius: 6px;
            font-size: 12px;
            color: #666;
            line-height: 1.5;
        }

        .jump-btn {
            margin-top: 16px;
            padding: 8px 20px;
            background: #07c160;
            color: #fff;
            border: none;
            border-radius: 4px;
            font-size: 14px;
            cursor: pointer;
        }

        .jump-btn:active {
            opacity: 0.8;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
            opacity: 0;
            transition: opacity 0.3s ease;
            display: block;
        }

        iframe.loaded {
            opacity: 1;
        }

        .error-container {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            color: #666;
            display: none;
            padding: 20px;
            max-width: 80%;
        }

        .error-container .icon {
            font-size: 48px;
            margin-bottom: 15px;
        }

        .error-container p {
            font-size: 16px;
            line-height: 1.5;
            margin-bottom: 20px;
        }

        .error-container button {
            padding: 12px 32px;
            background: #07c160;
            color: #fff;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            cursor: pointer;
            outline: none;
        }

        .error-container button:active {
            opacity: 0.8;
        }
    </style>
</head>

<body>
    <div id="loading">
        <div class="spinner"></div>
        <p id="loadingText">点击下方按钮加载页面</p>
        <div class="url-box" id="urlBox"></div>
        <button class="jump-btn" id="loadBtn">加载目标页面</button>
    </div>

    <div class="error-container" id="error">
        <div class="icon">⚠️</div>
        <p id="errorText">页面加载失败</p>
        <button onclick="location.reload()">重新加载</button>
    </div>

    <!-- 初始空白页，禁止自动加载 -->
    <iframe id="frame" src="about:blank"
        sandbox="allow-scripts allow-same-origin allow-forms allow-popups allow-popups-to-escape-sandbox"
        allow="fullscreen"></iframe>

    <script>
        (function () {
            'use strict';
            const CONFIG = { enableWhitelist: false, whitelist: ['your-company.com'], timeout: 10000 };
            const loadingEl = document.getElementById('loading');
            const loadingTextEl = document.getElementById('loadingText');
            const errorEl = document.getElementById('error');
            const errorTextEl = document.getElementById('errorText');
            const frameEl = document.getElementById('frame');
            const urlBox = document.getElementById('urlBox');
            const loadBtn = document.getElementById('loadBtn');
            const spinner = document.querySelector('.spinner');

            let currentTargetUrl = '';
            let isLoaded = false;
            let isLoading = false;

            function showError(message) {
                loadingEl.style.display = 'none';
                errorEl.style.display = 'block';
                errorTextEl.textContent = message;
                document.title = '加载失败';
            }

            function hideLoading() {
                loadingEl.style.opacity = '0';
                setTimeout(() => {
                    loadingEl.style.display = 'none';
                    frameEl.classList.add('loaded');
                }, 300);
            }

            // 自动补全协议 + 校验URL
            function formatAndCheckUrl(url) {
                let tempUrl = url.trim();
                // 没有 http/https 自动补上 https
                if (!/^https?:\/\//i.test(tempUrl)) {
                    tempUrl = 'https://' + tempUrl;
                }
                try {
                    const urlObj = new URL(tempUrl);
                    if (!['http:', 'https:'].includes(urlObj.protocol)) return false;
                    if (CONFIG.enableWhitelist) {
                        const hostname = urlObj.hostname;
                        return CONFIG.whitelist.some(domain => hostname === domain || hostname.endsWith('.' + domain));
                    }
                    return tempUrl;
                } catch (e) {
                    return false;
                }
            }

            function getTargetUrl() {
                const urlParams = new URLSearchParams(window.location.search);
                let targetUrl = urlParams.get('url');
                if (!targetUrl) {
                    const system = urlParams.get('sys');
                    const path = urlParams.get('path') || '/';
                    const SYSTEM_MAP = {
                        'crm': 'https://crm.your-company.com',
                        'erp': 'https://erp.your-company.com',
                        'oa': 'https://oa.your-company.com',
                        'report': 'https://report.your-company.com'
                    };
                    if (system && SYSTEM_MAP[system]) {
                        targetUrl = SYSTEM_MAP[system] + path;
                        const otherParams = [];
                        urlParams.forEach((value, key) => {
                            if (key !== 'sys' && key !== 'path') otherParams.push(`${encodeURIComponent(key)}=${encodeURIComponent(value)}`);
                        });
                        if (otherParams.length > 0) targetUrl += (path.includes('?') ? '&' : '?') + otherParams.join('&');
                    }
                }
                return targetUrl;
            }

            function startLoad() {
                if (isLoading || isLoaded) return;
                isLoading = true;

                spinner.style.display = 'block';
                loadingTextEl.textContent = '页面加载中...';
                loadBtn.disabled = true;

                frameEl.src = currentTargetUrl;

                frameEl.onload = function () {
                    if (!isLoaded) {
                        isLoaded = true;
                        isLoading = false;
                        hideLoading();
                    }
                };

                frameEl.onerror = function () {
                    isLoading = false;
                    showError('页面加载失败，请检查网络连接');
                };

                setTimeout(() => {
                    if (!isLoaded) hideLoading();
                }, CONFIG.timeout);
            }

            function init() {
                const rawUrl = getTargetUrl();
                if (!rawUrl) {
                    showError('缺少目标页面参数，请检查链接是否正确');
                    return;
                }

                let decodedUrl;
                try {
                    decodedUrl = decodeURIComponent(rawUrl);
                } catch (e) {
                    decodedUrl = rawUrl;
                }

                // 格式化+校验
                const finalUrl = formatAndCheckUrl(decodedUrl);
                if (!finalUrl) {
                    showError('无效的页面地址');
                    return;
                }

                currentTargetUrl = finalUrl;
                urlBox.innerText = '目标地址：' + currentTargetUrl;
                loadBtn.addEventListener('click', startLoad);
            }

            init();
        })();
    </script>
</body>

</html>
